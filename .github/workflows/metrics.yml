name: Metrics

on:
  schedule: [{cron: "0 6 * * *"}]
  workflow_dispatch:
  push: {branches: ["main"]}

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics.svg
          config_timezone: America/Guayaquil

          # Base: header, actividad reciente, comunidad y stats de repos
          base: header, activity, community, repositories
          plugin_lines: yes

          # Calendario de contribuciones (isométrico, año completo)
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

          # Hábitos: actividad por hora/día y lenguajes recientes
          plugin_habits: yes
          plugin_habits_facts: yes
          plugin_habits_charts: yes

          # Lenguajes más usados
          plugin_languages: yes
          plugin_languages_ignored: html, css
          plugin_languages_limit: 8
          plugin_languages_details: percentage

          # Logros estilo GitHub
          plugin_achievements: yes
          plugin_achievements_display: compact
